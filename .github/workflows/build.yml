name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout public builds repo
        uses: actions/checkout@v4
        with:
          repository: castiel430/vahsikelebek-builds
          ref: main
          token: ${{ secrets.BUILDS_TOKEN }}
          path: builds

      - name: Clean old builds
        run: rm -f "$GITHUB_WORKSPACE/builds"/*.cs3

      - name: Yayındaki manifesti yedekle
        run: cp "$GITHUB_WORKSPACE/builds/plugins.json" "$RUNNER_TEMP/prev_plugins.json" || true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Build Plugins
        run: |
          cd "$GITHUB_WORKSPACE/src"
          chmod +x gradlew
          ./gradlew make makePluginsJson --stacktrace
          find . -path "*/build/*.cs3" -exec cp {} "$GITHUB_WORKSPACE/builds/" \;
          cp build/plugins.json "$GITHUB_WORKSPACE/builds/plugins.json"

      - name: Repo manifestini dağıtım reposuna kopyala
        run: cp "$GITHUB_WORKSPACE/src/repo.json" "$GITHUB_WORKSPACE/builds/repo.json"

      - name: Plugin URL'lerini public depoya yönlendir
        run: |
          python3 - <<'EOF'
          import os
          path = os.environ["GITHUB_WORKSPACE"] + "/builds/plugins.json"
          with open(path, encoding="utf-8") as f:
              content = f.read()
          content = content.replace(
              "https://raw.githubusercontent.com/castiel430/vahsikelebek/builds/",
              "https://raw.githubusercontent.com/castiel430/vahsikelebek-builds/main/",
          )
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print("plugins.json URL'leri güncellendi")
          EOF

      - name: Sürüm artışı kontrolü
        run: |
          python3 - <<'EOF'
          import json, os, sys

          new_path = os.environ["GITHUB_WORKSPACE"] + "/builds/plugins.json"
          prev_path = os.environ["RUNNER_TEMP"] + "/prev_plugins.json"

          if not os.path.exists(prev_path):
              print("Önceki manifest yok, kontrol atlandı.")
              sys.exit(0)

          with open(prev_path, encoding="utf-8") as f:
              prev = {p["internalName"]: p for p in json.load(f)}
          with open(new_path, encoding="utf-8") as f:
              new = {p["internalName"]: p for p in json.load(f)}

          stale = []
          for name, plugin in new.items():
              old = prev.get(name)
              if not old:
                  continue
              changed = (old.get("fileHash") != plugin.get("fileHash")
                         or old.get("fileSize") != plugin.get("fileSize"))
              if changed and old.get("version", 0) == plugin.get("version", 0):
                  stale.append(name)

          if stale:
              msg = ("Bu eklentilerin kodu değişti ama sürümü artmadı, "
                     "uygulama güncellemeyi görmez: " + ", ".join(sorted(stale)))
              print("::warning title=Sürüm artırılmadı::" + msg)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  f.write("### ⚠️ Sürüm artırılmadı\n\n" + msg + "\n")
          else:
              print("Tüm değişen eklentilerin sürümü artmış.")
          EOF

      - name: Push builds
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A
          if git diff --cached --quiet; then
            echo "No build changes to publish."
            exit 0
          fi
          git commit -m "Build $GITHUB_SHA"
          git push origin HEAD:main
